name: Blogger News Poster

on:
  schedule:
    - cron: "0 * * * *"   # every hour (UTC)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write          # needed for git push

concurrency:
  group: blogger-news-poster
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: |
          printf 'BLOG_ID=%s\n' "$BLOG_ID" > .env

      - name: Create credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Create token.pickle
        env:
          TOKEN_PICKLE: ${{ secrets.TOKEN_PICKLE }}
        run: |
          printf '%s' "$TOKEN_PICKLE" | base64 -d > token.pickle

      - name: Create initial news_log.json if not exists
        run: |
          if [ ! -f news_log.json ]; then
            echo "[]" > news_log.json
          fi

      - name: Run Blogger News Poster
        run: python blogger_news_poster.py

      - name: Commit and push if changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news_log.json
          [ -f README.md ] && git add README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news posts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
